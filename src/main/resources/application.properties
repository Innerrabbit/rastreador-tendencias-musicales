# Rastreador de Tendencias Musicales - configuración de la aplicación web.
# Aquí NO hay secretos: la conexión a la base de datos (BD_URL, BD_USUARIO, BD_CLAVE)
# y las claves de los usuarios (ADMIN_CLAVE, ANALISTA_CLAVE) se leen de variables de entorno.

spring.application.name=rastreador-tendencias-musicales

# Solo se atiende desde este mismo computador (diagrama de despliegue: localhost:8080).
server.address=127.0.0.1
server.port=8080

# No exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.co.edu.sena.rastreador=INFO
